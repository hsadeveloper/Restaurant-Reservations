server.port=7083

# Database Configuration
spring.docker.compose.enabled=false
spring.datasource.url=jdbc:postgresql://localhost:5433/restaurants
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.cloud.compatibility-verifier.enabled=false

# ========== AMQP & RABBITMQ BINDER CONFIGURATION ==========
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.cloud.stream.rabbit.binder.host=localhost
spring.cloud.stream.rabbit.binder.port=5673
spring.cloud.stream.rabbit.binder.username=guest
spring.cloud.stream.rabbit.binder.password=guest

# ========== REDIS CONFIGURATION ==========
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

# ========== SPRING CLOUD STREAM SETUP ==========
spring.cloud.stream.function.autodetect=false
spring.cloud.function.definition=processBrief;consumeAvailableTables

# =========================================================================
# BINDINGS FOR: processBrief (Producer Callback Flow)
# =========================================================================
spring.cloud.stream.bindings.processBrief-in-0.destination=table-confirmation-exchange
spring.cloud.stream.bindings.processBrief-in-0.group=table-service-group

spring.cloud.stream.bindings.brief-request-out-0.destination=table-create-exchange
spring.cloud.stream.bindings.brief-request-out-1.destination=table-confirmation-exchange

# =========================================================================
# BINDINGS FOR: consumeAvailableTables (Table Caching Flow)
# =========================================================================
spring.cloud.stream.bindings.consumeAvailableTables-in-0.destination=table-available-exchange
spring.cloud.stream.bindings.consumeAvailableTables-in-0.group=table-cache-group
