
<style>
.wrap{background:#0f1117;border-radius:12px;padding:1.5rem}
</style>
<div class="wrap">
<svg width="100%" viewBox="0 0 680 620" role="img">
<title>Hexagonal architecture dark theme — Controller to RepositoryPort to Adapter</title>
<desc>Dark background structural diagram showing ReservationController calling RestaurantTableRepositoryPort implemented by RestaurantTableRepositoryAdapter delegating to JPA repositories</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Outer container: Infrastructure layer -->
<rect x="20" y="20" width="640" height="580" rx="20" fill="none" stroke="#3a3d4a" stroke-width="1" stroke-dasharray="6 4"/>
<text font-size="12" font-family="var(--font-sans)" x="340" y="42" text-anchor="middle" fill="#5a5e70">Infrastructure layer</text>

<!-- Middle container: Application layer -->
<rect x="200" y="210" width="280" height="220" rx="16" fill="none" stroke="#2e3044" stroke-width="1" stroke-dasharray="4 3"/>
<text font-size="12" font-family="var(--font-sans)" x="340" y="228" text-anchor="middle" fill="#5a5e70">Application layer</text>

<!-- Controller: ReservationController -->
<g class="node" onclick="sendPrompt('What does ReservationController do in hexagonal architecture?')" style="cursor:pointer">
  <rect x="40" y="60" width="220" height="56" rx="8" fill="#0c447c" stroke="#378ADD" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" font-family="var(--font-sans)" x="150" y="82" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4">ReservationController</text>
  <text font-size="12" font-family="var(--font-sans)" x="150" y="100" text-anchor="middle" dominant-baseline="central" fill="#85B7EB">POST /api/reservations</text>
</g>

<!-- Port: RestaurantTableRepositoryPort -->
<g class="node" onclick="sendPrompt('What is RestaurantTableRepositoryPort?')" style="cursor:pointer">
  <rect x="210" y="240" width="260" height="56" rx="8" fill="#26215c" stroke="#7F77DD" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" font-family="var(--font-sans)" x="340" y="260" text-anchor="middle" dominant-baseline="central" fill="#CECBF6">RestaurantTableRepositoryPort</text>
  <text font-size="12" font-family="var(--font-sans)" x="340" y="278" text-anchor="middle" dominant-baseline="central" fill="#AFA9EC">save() · findAll() · exists()</text>
</g>

<!-- Port: TableRepositoryPort -->
<g class="node" onclick="sendPrompt('What is TableRepositoryPort?')" style="cursor:pointer">
  <rect x="210" y="330" width="260" height="56" rx="8" fill="#26215c" stroke="#7F77DD" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" font-family="var(--font-sans)" x="340" y="350" text-anchor="middle" dominant-baseline="central" fill="#CECBF6">TableRepositoryPort</text>
  <text font-size="12" font-family="var(--font-sans)" x="340" y="368" text-anchor="middle" dominant-baseline="central" fill="#AFA9EC">save() · findAll() · getByTableId()</text>
</g>

<!-- Adapter: RestaurantTableRepositoryAdapter -->
<g class="node" onclick="sendPrompt('What does RestaurantTableRepositoryAdapter do?')" style="cursor:pointer">
  <rect x="40" y="450" width="260" height="56" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" font-family="var(--font-sans)" x="170" y="470" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">RestaurantTableRepositoryAdapter</text>
  <text font-size="12" font-family="var(--font-sans)" x="170" y="488" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5">implements RepositoryPort</text>
</g>

<!-- Adapter: TableRepositoryAdapter -->
<g class="node" onclick="sendPrompt('What does TableRepositoryAdapter do?')" style="cursor:pointer">
  <rect x="380" y="450" width="260" height="56" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" font-family="var(--font-sans)" x="510" y="470" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">TableRepositoryAdapter</text>
  <text font-size="12" font-family="var(--font-sans)" x="510" y="488" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5">implements TableRepositoryPort</text>
</g>

<!-- JPA: TableReservationRepository -->
<g class="node" onclick="sendPrompt('What does TableReservationRepository extend?')" style="cursor:pointer">
  <rect x="40" y="556" width="240" height="44" rx="8" fill="#412402" stroke="#EF9F27" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" font-family="var(--font-sans)" x="160" y="572" text-anchor="middle" dominant-baseline="central" fill="#FAC775">TableReservationRepository</text>
  <text font-size="12" font-family="var(--font-sans)" x="160" y="590" text-anchor="middle" dominant-baseline="central" fill="#EF9F27">JpaRepository&lt;TableReservation&gt;</text>
</g>

<!-- JPA: TableDefinationRepository -->
<g class="node" onclick="sendPrompt('What does TableDefinationRepository extend?')" style="cursor:pointer">
  <rect x="400" y="556" width="240" height="44" rx="8" fill="#412402" stroke="#EF9F27" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" font-family="var(--font-sans)" x="520" y="572" text-anchor="middle" dominant-baseline="central" fill="#FAC775">TableDefinationRepository</text>
  <text font-size="12" font-family="var(--font-sans)" x="520" y="590" text-anchor="middle" dominant-baseline="central" fill="#EF9F27">JpaRepository&lt;TableDefination&gt;</text>
</g>

<!-- Arrow: Controller → RestaurantTableRepositoryPort -->
<path d="M150 116 L150 180 L310 180 L310 239" fill="none" stroke="#4a6fa8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" font-family="var(--font-sans)" x="230" y="172" text-anchor="middle" fill="#4a6fa8">calls</text>

<!-- Arrow: Controller → TableRepositoryPort (dashed) -->
<path d="M260 88 L600 88 L600 380 L471 380" fill="none" stroke="#4a6fa8" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 3"/>
<text font-size="12" font-family="var(--font-sans)" x="580" y="80" text-anchor="middle" fill="#4a6fa8">calls</text>

<!-- Arrow: RestaurantTableRepositoryPort → Adapter -->
<path d="M310 296 L200 296 L200 449" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" font-family="var(--font-sans)" x="148" y="378" text-anchor="middle" fill="#1D9E75">implements</text>

<!-- Arrow: TableRepositoryPort → TableRepositoryAdapter -->
<path d="M430 386 L510 386 L510 449" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" font-family="var(--font-sans)" x="558" y="420" text-anchor="middle" fill="#1D9E75">implements</text>

<!-- Arrow: RestaurantTableRepositoryAdapter → JPA -->
<line x1="160" y1="506" x2="160" y2="555" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" font-family="var(--font-sans)" x="200" y="534" fill="#6b7280">delegates</text>

<!-- Arrow: TableRepositoryAdapter → JPA -->
<line x1="510" y1="506" x2="510" y2="555" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" font-family="var(--font-sans)" x="550" y="534" fill="#6b7280">delegates</text>

<!-- Legend -->
<rect x="420" y="165" width="10" height="10" rx="2" fill="#0c447c" stroke="#378ADD" stroke-width="0.5"/>
<text font-size="12" font-family="var(--font-sans)" x="436" y="174" fill="#6b7280">Inbound adapter</text>
<rect x="420" y="183" width="10" height="10" rx="2" fill="#26215c" stroke="#7F77DD" stroke-width="0.5"/>
<text font-size="12" font-family="var(--font-sans)" x="436" y="192" fill="#6b7280">Port (interface)</text>
<rect x="420" y="201" width="10" height="10" rx="2" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
<text font-size="12" font-family="var(--font-sans)" x="436" y="210" fill="#6b7280">Outbound adapter</text>
<rect x="540" y="201" width="10" height="10" rx="2" fill="#412402" stroke="#EF9F27" stroke-width="0.5"/>
<text font-size="12" font-family="var(--font-sans)" x="556" y="210" fill="#6b7280">JPA repository</text>

</svg>
</div>
