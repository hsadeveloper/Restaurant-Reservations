spring.application.name=rest-table-service
server.port=1987

# ========== DATABASE CONFIGURATION ==========
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5435/table
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========== SQL SCRIPT BYPASS ==========
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ========== EVENT STREAM CONFIGURATION ==========
# UNCOMMENTED: Pointing Spring to your custom Mac port layout
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ========== Redis ==========
# UNCOMMENTED: Activating your running Redis connection
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ========== Log ==========
logging.file.name=app.log