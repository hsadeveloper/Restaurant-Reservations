spring.application.name=rest-table-service
server.port=1987

# ========== DATABASE CONFIGURATION ==========
spring.jpa.hibernate.ddl-auto=update

# FIXED: Changed port from 5435 to 5433 to match your running docker container
spring.datasource.url=jdbc:postgresql://localhost:5435/table


spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Forces Hibernate to bypass the connection handshake check
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========== SQL SCRIPT BYPASS ==========
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ========== RABBITMQ BROKER CONFIGURATION ==========
spring.rabbitmq.host=127.0.0.1
# FIXED: Changed port from 5673 to 5674 to match your running docker container
spring.rabbitmq.port=5674
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ========== EVENT STREAM CONFIGURATION ==========
stream.name=events.super.streams.filtering



