spring.application.name=rest-table-service
server.port=1987

# ========== DATABASE CONFIGURATION ==========
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5435/table
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========== SQL SCRIPT BYPASS ==========
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ========== RabbitMQ Native Properties (Fallback) ==========
rabbitmq.queue.name=restaurant.queue
rabbitmq.exchange.name=restaurant.exchange
rabbitmq.routing.key=restaurant.created

# ========== EVENT STREAM BROKER CONFIGURATION ==========
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ========== Redis ==========
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ========== Log ==========
logging.file.name=app.log

# ========== Spring Cloud Stream Setup ==========
# Disable automatic scanning of functional beans
# ========== Spring Cloud Stream Setup ==========

spring.cloud.stream.function.autodetect=false

# 1. Register the Consumer function name
spring.cloud.function.definition=processCreationRequest

# 2. Inbound Binding (Listens for incoming requests from the producer)
spring.cloud.stream.bindings.processCreationRequest-in-0.destination=table-create-exchange

# For the input binding named processCreationRequest-in-0, use table-service-group as the consumer group.
spring.cloud.stream.bindings.processCreationRequest-in-0.group=table-service-group

# 3. Outbound Binding (Publishes the reply back to the producer)
spring.cloud.stream.bindings.processCreationRequest-out-0.destination=table-confirmation-exchange